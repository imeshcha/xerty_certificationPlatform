services:
  - type: web
    name: xerty-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: PINATA_GATEWAY_URL
        value: https://gateway.pinata.cloud/ipfs
      - key: BLOCKCHAIN_RPC_URL
        value: https://sepolia-rollup.arbitrum.io/rpc
      - key: BLOCKCHAIN_CHAIN_ID
        value: 421614
      - key: BLOCKCHAIN_CONTRACT_ADDRESS
        sync: false
      - key: CORS_ORIGIN
        sync: false
